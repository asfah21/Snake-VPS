<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070913">
  <title>Masuk - Snake Live Hub</title>
  <style>
    :root {
      --bg: #070913;
      --card: rgba(15, 23, 42, 0.82);
      --border: rgba(56, 189, 248, 0.22);
      --border-focus: rgba(56, 189, 248, 0.75);
      --cyan: #38bdf8;
      --pink: #ec4899;
      --purple: #a855f7;
      --green: #10b981;
      --red: #f87171;
      --text: #f8fafc;
      --muted: #94a3b8;
      --input: rgba(2, 6, 23, 0.62);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(at 12% 8%, rgba(56, 189, 248, 0.18) 0px, transparent 46%),
        radial-gradient(at 88% 4%, rgba(236, 72, 153, 0.16) 0px, transparent 44%),
        radial-gradient(at 50% 100%, rgba(168, 85, 247, 0.14) 0px, transparent 52%),
        linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px);
      background-size: auto, auto, auto, 44px 44px, 44px 44px;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    .ambient {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.32;
      pointer-events: none;
      z-index: 0;
      animation: float 12s ease-in-out infinite;
    }

    .ambient.one {
      top: -120px;
      left: -100px;
      background: var(--cyan);
    }

    .ambient.two {
      bottom: -130px;
      right: -110px;
      background: var(--pink);
      animation-delay: -6s;
    }

    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(16px, -18px, 0) scale(1.06); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      text-align: left;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      font-size: 28px;
      border-radius: 17px;
      background: linear-gradient(145deg, rgba(56, 189, 248, 0.22), rgba(168, 85, 247, 0.28));
      border: 1px solid rgba(56, 189, 248, 0.38);
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .brand-copy strong {
      display: block;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .brand-copy span {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .card {
      position: relative;
      padding: 32px;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.52),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.8), rgba(236, 72, 153, 0.65), transparent);
    }

    h1 {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.55;
    }

    form {
      margin-top: 26px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #cbd5e1;
    }

    .input-shell {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border-radius: 14px;
      background: var(--input);
      border: 1px solid rgba(148, 163, 184, 0.18);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .input-shell:focus-within {
      border-color: var(--border-focus);
      background: rgba(2, 6, 23, 0.82);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.11);
    }

    .input-shell svg {
      flex: 0 0 auto;
      width: 17px;
      height: 17px;
      color: #64748b;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 13px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14.5px;
    }

    input::placeholder {
      color: #526077;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px #0b1224 inset;
      transition: background-color 9999s ease-out;
    }

    .toggle-password {
      flex: 0 0 auto;
      padding: 6px 2px;
      border: 0;
      background: transparent;
      color: var(--cyan);
      font: inherit;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      border-radius: 8px;
    }

    .toggle-password:hover {
      color: #7dd3fc;
    }

    .toggle-password:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .error {
      display: none;
      align-items: flex-start;
      gap: 9px;
      margin: 2px 0 16px;
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(248, 113, 113, 0.32);
      color: #fecaca;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .error.visible {
      display: flex;
      animation: shake 0.32s ease;
    }

    .error svg {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      color: var(--red);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .submit {
      position: relative;
      width: 100%;
      margin-top: 4px;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      color: #04121f;
      background: linear-gradient(100deg, #67e8f9, #38bdf8 45%, #a78bfa);
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(56, 189, 248, 0.24);
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
    }

    .submit:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.04);
      box-shadow: 0 18px 38px rgba(56, 189, 248, 0.32);
    }

    .submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit:focus-visible {
      outline: 2px solid #e0f2fe;
      outline-offset: 3px;
    }

    .submit:disabled {
      cursor: wait;
      opacity: 0.72;
      box-shadow: none;
    }

    .spinner {
      display: none;
      width: 15px;
      height: 15px;
      margin-right: 8px;
      vertical-align: -2px;
      border: 2px solid rgba(4, 18, 31, 0.28);
      border-top-color: #04121f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .submit.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 20px;
      color: #64748b;
      font-size: 11.5px;
      line-height: 1.4;
      text-align: center;
    }

    .meta svg {
      flex: 0 0 auto;
      width: 13px;
      height: 13px;
      color: var(--green);
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: #475569;
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    @media (max-width: 460px) {
      body { padding: 20px 14px; }
      .card { padding: 26px 22px; border-radius: 24px; }
      h1 { font-size: 24px; }
      .brand { justify-content: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient one"></div>
  <div class="ambient two"></div>

  <main class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">🐍</div>
      <div class="brand-copy">
        <strong>Snake Live Hub</strong>
        <span>TikTok Live Control</span>
      </div>
    </div>

    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title">Selamat datang kembali</h1>
      <p class="subtitle">Masuk untuk membuka dashboard dan mengendalikan bot live.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <div class="input-shell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="Masukkan username"
              autocomplete="username"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              maxlength="128"
              required
              autofocus
            >
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-shell">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              <circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"></circle>
            </svg>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              maxlength="1024"
              required
            >
            <button class="toggle-password" id="toggle-password" type="button" aria-label="Tampilkan password">Lihat</button>
          </div>
        </div>

        <div class="error" id="error-box" role="alert" aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v5"></path>
            <path d="M12 16.5h.01"></path>
          </svg>
          <span id="error-text"></span>
        </div>

        <button class="submit" id="submit-btn" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submit-label">Masuk ke Dashboard</span>
        </button>
      </form>

      <div class="meta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"></path>
          <path d="M9.5 12.2l1.7 1.7 3.5-3.6"></path>
        </svg>
        <span>Sesi aman dengan cookie HttpOnly &amp; JWT</span>
      </div>
    </section>

    <p class="footer">Hanya untuk admin yang berwenang.</p>
  </main>

  <script>
    (function () {
      "use strict";

      const form = document.getElementById("login-form");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const toggleButton = document.getElementById("toggle-password");
      const submitButton = document.getElementById("submit-btn");
      const submitLabel = document.getElementById("submit-label");
      const errorBox = document.getElementById("error-box");
      const errorText = document.getElementById("error-text");

      function safeNext(value) {
        if (!value || typeof value !== "string") return "/";
        if (value.charAt(0) !== "/") return "/";
        if (value.charAt(1) === "/" || value.charAt(1) === "\\") return "/";
        if (value.indexOf("\n") !== -1 || value.indexOf("\r") !== -1) return "/";
        return value;
      }

      const nextUrl = safeNext(new URLSearchParams(window.location.search).get("next"));

      function hideError() {
        errorBox.classList.remove("visible");
        errorText.textContent = "";
      }

      function showError(message) {
        errorText.textContent = message;
        errorBox.classList.add("visible");
      }

      function setLoading(isLoading) {
        submitButton.disabled = isLoading;
        submitButton.classList.toggle("loading", isLoading);
        submitLabel.textContent = isLoading ? "Memeriksa..." : "Masuk ke Dashboard";
        usernameInput.disabled = isLoading;
        passwordInput.disabled = isLoading;
        toggleButton.disabled = isLoading;
      }

      toggleButton.addEventListener("click", function () {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        toggleButton.textContent = show ? "Sembunyi" : "Lihat";
        toggleButton.setAttribute("aria-label", show ? "Sembunyikan password" : "Tampilkan password");
        passwordInput.focus();
        const length = passwordInput.value.length;
        try {
          passwordInput.setSelectionRange(length, length);
        } catch (_) {}
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        hideError();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          showError("Username dan password wajib diisi.");
          (username ? passwordInput : usernameInput).focus();
          return;
        }

        setLoading(true);
        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            cache: "no-store",
            body: JSON.stringify({ username: username, password: password })
          });

          let data = {};
          try {
            data = await response.json();
          } catch (_) {}

          if (response.ok && data.ok) {
            submitLabel.textContent = "Berhasil! Mengalihkan...";
            window.location.replace(nextUrl);
            return;
          }

          if (response.status === 429) {
            const retryAfter = parseInt(response.headers.get("Retry-After") || "60", 10);
            const seconds = Number.isFinite(retryAfter) && retryAfter > 0 ? retryAfter : 60;
            showError("Terlalu banyak percobaan. Tunggu " + seconds + " detik lalu coba lagi.");
          } else if (response.status === 401) {
            showError("Username atau password salah.");
            passwordInput.value = "";
            passwordInput.focus();
          } else {
            showError(data.error || "Gagal masuk. Silakan coba lagi.");
          }
        } catch (_) {
          showError("Tidak bisa terhubung ke server. Periksa koneksi lalu coba lagi.");
        } finally {
          setLoading(false);
        }
      });

      // Jika sesi masih valid, langsung masuk tanpa mengisi form lagi.
      (async function checkSession() {
        try {
          const response = await fetch("/api/me", {
            credentials: "same-origin",
            cache: "no-store"
          });
          if (response.ok) {
            window.location.replace(nextUrl);
          }
        } catch (_) {}
      })();
    })();
  </script>
</body>
</html>
