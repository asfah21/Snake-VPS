<style>
html,body{margin:0;height:100%;height:100dvh;background:#02040a;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}

#top .c-r{color:#38bdf8}#top .c-l{color:#ffe066}#top .c-e{color:#ff4365}

#over .nx{font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:#38bdf8;font-weight:800;font-variant-numeric:tabular-nums}
#start{inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(6,15,35,0.7),rgba(2,4,10,0.96));cursor:default;border-radius:0;border:0;text-align:center;padding:0;transition:opacity .5s;opacity:1}
#start.off{opacity:0}
#cdwrap{position:relative;display:grid;place-items:center;width:520px;height:520px}
#cdring{position:absolute;inset:0;border-radius:50%;border:8px solid rgba(56,189,248,0.65);box-shadow:0 0 90px rgba(56,189,248,0.5),inset 0 0 90px rgba(236,72,153,0.4);opacity:0}
#cd{position:relative;font-size:280px;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 50px #38bdf8,0 0 120px #0284c7,0 8px 0 rgba(0,0,0,0.8);opacity:0;will-change:transform,opacity}

body.lite .sweep i{animation:none;opacity:0}
body.lite #cd{text-shadow:none}

<script type="module">
import * as THREE from 'three';
const QS=new URLSearchParams(location.search), $=id=>document.getElementById(id);

/* ================= LOGIKA GAME =================
   Model gerak internal tetap berbasis sel/grid; visualnya diinterpolasi halus pada render.
   AI meniru pola spiral melalui siklus Hamilton, dengan shortcut yang dinilai dan safety override.
   Ini meniru pola yang terlihat, bukan membuktikan algoritma internal pemain pada video. */
//LOGIC_START
const PORT=QS.get('layout')?QS.get('layout')==='portrait':true,
      // Board gameplay dikunci 16x16 agar komposisi dan pola ular konsisten di semua viewport.
      W=16,H=16,N=W*H, idx=new Int16Array(N), cyc=[];
document.body.classList.add(PORT?'p':'l');
for(let x=0;x<W;x++)cyc.push([x,0]);
for(let r=1;r<H;r++){if(r%2)for(let x=W-1;x>=1;x--)cyc.push([x,r]);else for(let x=1;x<W;x++)cyc.push([x,r]);}
for(let y=H-1;y>=1;y--)cyc.push([0,y]);
cyc.forEach((c,i)=>idx[c[1]*W+c[0]]=i);
const cell=i=>cyc[i][1]*W+cyc[i][0];
let snake,occ,apples,prev,eaten=0,round=1;
function reset(){occ=new Uint8Array(N);apples=new Set();snake=[cell(2),cell(1),cell(0)];snake.forEach(c=>occ[c]=1);prev=snake.slice();eaten=0;}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const _dist=new Int16Array(N),_first=new Int16Array(N),_q=new Int32Array(N);
const _parent=new Int32Array(N),_bodyIdx=new Int16Array(N),_vOcc=new Uint8Array(N),_visited=new Uint8Array(N);
const _tailDist=new Int16Array(N),_pathBuf=new Int32Array(N);

/* BFS standar (digunakan oleh freeCell untuk mencari sel bebas yang terjangkau) */
function bfs(start,allow){
  _dist.fill(-1);
  let head=0,tail=0;_q[tail++]=start;_dist[start]=0;
  while(head<tail){
    const c=_q[head++],cx=c%W,cy=(c/W)|0,d1=_dist[c]+1;
    for(let k=0;k<4;k++){
      const x=cx+DIRS[k][0],y=cy+DIRS[k][1];
      if(x<0||y<0||x>=W||y>=H)continue;
      const m=y*W+x;
      if(_dist[m]>=0)continue;
      if(occ[m]&&m!==allow)continue;
      _dist[m]=d1;
      _q[tail++]=m;
    }
  }
}

/* ===================== AI STRATEGIS (bermain seperti pemain berpengalaman) =====================
   Prioritas: 1) BERTAHAN HIDUP  >  2) MENJAGA RUANG GERAK  >  3) MENGEJAR APEL.

   1) Keselamatan (mutlak): badan ular selalu tersusun menurut urutan siklus Hamilton (ekor -> kepala).
      Hanya jalur yang MAJU searah siklus lewat sel kosong yang dipertimbangkan, dengan posisi ekor
      dihitung PADA SETIAP TICK (ekor bergeser, tumbuh saat makan). Jalur seperti ini tidak pernah
      memotong ekor/badan, tidak pernah mengurung diri, dan selalu menyisakan jalan keluar.
   2) Ruang: setiap rencana disimulasikan sampai ular selesai makan, lalu diukur sel kosong yang
      terisolasi (lubang) dan ruang yang masih terjangkau. Jalan pintas yang meninggalkan banyak lubang
      dihukum, makin berat ketika papan makin penuh (isi papan secara terencana, bukan acak).
   3) Apel: dari beberapa kandidat apel, ular mensimulasikan makan apel itu lalu menghitung seberapa
      mudah apel BERIKUTNYA (lookahead 2 apel). Target dipertahankan (komitmen) agar tidak plin-plan.
   Gerakan natural: jalur lurus diutamakan; belok dihitung mahal bila dilakukan terlalu dini, sehingga ular
   mempertahankan arah dan baru bermanuver mendekati apel. Tanpa apel / apel tak aman: mengikuti
   siklus (mengekor jalur sendiri) sampai ada peluang lebih baik. */
const INF=1e9,STEP_C=100,NS=N*5;
const _cost=new Float64Array(NS),_stp=new Int32Array(NS),_apc=new Int32Array(NS),_par=new Int32Array(NS);
const _bodyOff=new Int32Array(N+1);
const _fOcc=new Uint8Array(N),_fSeen=new Uint8Array(N),_fQ=new Int32Array(N);
let _commit=-1;                                   // apel yang sedang dituju
/* Profil perilaku adaptif berdasarkan okupansi papan. Ambang fase: 50%, 65%, 85%.
   Bobot adalah heuristik awal, bukan hasil benchmark; keselamatan diperiksa terpisah. */
const AI_PHASES=[
  {name:'SHORT',max:.50,food:1.00,turn:.62,shortcut:.12,hole:0.75,reach:.38,lookahead:.24,commit:7,escape:3},
  {name:'MEDIUM',max:.65,food:.78,turn:1.00,shortcut:.24,hole:1.15,reach:.65,lookahead:.38,commit:12,escape:5},
  {name:'LONG',max:.85,food:.48,turn:1.25,shortcut:.42,hole:1.85,reach:1.00,lookahead:.52,commit:17,escape:8},
  {name:'CRITICAL',max:1.01,food:.20,turn:1.55,shortcut:.70,hole:2.80,reach:1.45,lookahead:.70,commit:22,escape:12}
];
function aiPhase(length){const fill=length/N;return AI_PHASES.find(p=>fill<p.max)||AI_PHASES[AI_PHASES.length-1];}
const AI_TUNE={arc0:.22,arc1:.62,hole0:.8,hole1:4.0,reach:.5,next:.4,turn:1.15,enroute:2.0,commit:18};

function dirIndex(a,b){                           // arah a->b (sel bersebelahan), 4 = tidak ada
  const dx=(b%W)-(a%W),dy=((b/W)|0)-((a/W)|0);
  for(let k=0;k<4;k++)if(DIRS[k][0]===dx&&DIRS[k][1]===dy)return k;
  return 4;
}

/* DP jalur MONOTON (offset siklus selalu bertambah) dari kepala. Biaya = langkah*100 + penalti belok.
   Penalti belok lebih besar bila belok terjadi di awal -> belok ditunda selambat mungkin. */
function dpPlan(snk,apl,dir0){
  const L=snk.length,hi=idx[snk[0]];
  for(let t=0;t<L;t++){const o=(idx[snk[L-1-t]]-hi+N)%N;_bodyOff[t]=o===0?N:o;}
  _cost.fill(INF);
  const s0=snk[0]*5+dir0;_cost[s0]=0;_stp[s0]=0;_apc[s0]=0;_par[s0]=-1;
  for(let o=0;o<N;o++){
    const c=cell((hi+o)%N),cx=c%W,cy=(c/W)|0;
    for(let d=0;d<5;d++){
      const st=c*5+d,cs=_cost[st];
      if(cs>=INF)continue;
      const s=_stp[st],a=_apc[st],tk=s-a;
      const T=tk>=L-1?N:_bodyOff[tk];                 // posisi ekor saat langkah ini dijalankan
      for(let k=0;k<4;k++){
        const nx=cx+DIRS[k][0],ny=cy+DIRS[k][1];
        if(nx<0||ny<0||nx>=W||ny>=H)continue;
        const m=ny*W+nx,om=(idx[m]-hi+N)%N;
        if(om<=o)continue;
        const g=apl.has(m)?1:0;
        if(!(om<T||(om===T&&!g)))continue;            // hanya sel kosong (ekor boleh ditempati jika tidak tumbuh)
        let nc=cs+STEP_C;
        if(d!==4&&d!==k)nc+=8+14*(1-Math.min(s,14)/14);
        const ns=m*5+k;
        if(nc<_cost[ns]){_cost[ns]=nc;_stp[ns]=s+1;_apc[ns]=a+g;_par[ns]=st;}
      }
    }
  }
  return hi;
}
function pathFrom(st){const r=[];while(_par[st]>=0){r.push((st/5)|0);st=_par[st];}return r.reverse();}
function bestAt(c){let b=-1,bc=INF;for(let d=0;d<4;d++){const v=_cost[c*5+d];if(v<bc){bc=v;b=c*5+d;}}return b;}

/* Simulasi ular setelah menjalani jalur (tumbuh tiap melewati apel) */
function simulate(snk,cells,apl){
  const L=snk.length,m=cells.length;let c=0,cnt=0;
  for(let i=0;i<m;i++)if(apl.has(cells[i]))c++;
  const newLen=Math.min(N,L+c),ns=new Array(newLen);let i=0;
  for(let j=m-1;j>=0&&i<newLen;j--)ns[i++]=cells[j];
  for(let j=0;j<L&&i<newLen;j++)ns[i++]=snk[j];
  return {ns,c};
}
/* Ruang: sel kosong terjangkau dari kepala (ekor dianggap kosong) & sel kosong yang terisolasi */
function floodStats(snk){
  const L=snk.length;_fOcc.fill(0);_fSeen.fill(0);
  for(let i=0;i<L-1;i++)_fOcc[snk[i]]=1;
  let h=0,t=0,reach=0;_fQ[t++]=snk[0];_fSeen[snk[0]]=1;
  while(h<t){
    const c=_fQ[h++],cx=c%W,cy=(c/W)|0;
    for(let k=0;k<4;k++){
      const x=cx+DIRS[k][0],y=cy+DIRS[k][1];
      if(x<0||y<0||x>=W||y>=H)continue;

      if(_fOcc[m]||_fSeen[m])continue;

/* Validasi simulasi langkah demi langkah: tidak boleh menabrak dinding/badan.
   Ekor boleh dimasuki hanya pada tick ketika ekor benar-benar bergerak dan ular tidak tumbuh. */
function routeIsSafe(snk,cells,apl){
  const body=snk.slice(),occupied=new Set(body);
  for(const next of cells){
    if(!Number.isInteger(next)||next<0||next>=N)return false;
    const grow=apl.has(next),tail=body[body.length-1];
    if(occupied.has(next)&&!(next===tail&&!grow))return false;
    if(!grow){body.pop();occupied.delete(tail);}
    body.unshift(next);occupied.add(next);
    if(body.length>N)return false;
  }
  return true;
}

function nextMove(){
  const L=snake.length;
  if(L>=N)return -1;
  const head=snake[0],tail=snake[L-1],hi=idx[head];
  const nxt=cell((hi+1)%N);
  const legal=m=>m>=0&&!(occ[m]&&!(m===tail&&!apples.has(m)));
  const cycleStep=()=>legal(nxt)?nxt:-1;                   // fallback: ikuti siklus (mengekor jalur sendiri)
  if(apples.size===0){_commit=-1;return cycleStep();}
  if(_commit>=0&&!apples.has(_commit))_commit=-1;
  const heading=L>1?dirIndex(snake[1],head):4;
  const phase=aiPhase(L),fill=L/N;

  // --- 1) kandidat apel & jalur aman dari DP (tanpa lubang diperhitungkan dulu)
  dpPlan(snake,apples,heading);
  const dpList=[];
  for(const a of apples){const st=bestAt(a);if(st>=0)dpList.push({a,st,cost:_cost[st]});}
  if(dpList.length===0)return cycleStep();
  dpList.sort((x,y)=>x.cost-y.cost);
  const picked=new Map();
  for(let i=0;i<Math.min(6,dpList.length);i++){const e=dpList[i];picked.set(e.a,pathFrom(e.st));}
  if(_commit>=0&&!picked.has(_commit)){const e=dpList.find(v=>v.a===_commit);if(e)picked.set(e.a,pathFrom(e.st));}
  const cands=[];
  for(const [a,cells] of picked)cands.push({a,cells,kind:'dp'});

  // --- jalur "ikut siklus" ke apel yang sama (tanpa jalan pintas = tanpa lubang)
  const tailAt0=t=>t>=L-1?N:(_bodyOff[t]);
  for(const [a] of picked){
    const offA=(idx[a]-hi+N)%N;if(offA<1)continue;
    const cells=[];let s=0,ac=0,ok=true;
    for(let i=1;i<=offA;i++){
      const x=cell((hi+i)%N),g=apples.has(x)?1:0,T=tailAt0(s-ac);
      if(!(i<T||(i===T&&!g))){ok=false;break;}
      cells.push(x);s++;ac+=g;
    }
    if(ok)cands.push({a,cells,kind:'cyc'});
  }

  // --- 2) evaluasi: simulasi tubuh setelah makan, ruang, lookahead apel berikutnya
  const before=floodStats(snake).holes;
  const hw=AI_TUNE.hole0+AI_TUNE.hole1*fill*fill+phase.hole;
  let best=null,bestScore=INF;
  for(const cd of cands){
    const m=cd.cells.length;if(m<1)continue;
    if(!legal(cd.cells[0])||dirIndex(head,cd.cells[0])===4)continue;
    // Hard constraint: validasi seluruh rute, bukan hanya langkah pertama.
    if(!routeIsSafe(snake,cd.cells,apples))continue;
    const sim=simulate(snake,cd.cells,apples);
    const fs=floodStats(sim.ns);
    const holePen=Math.max(0,fs.holes-before)*hw;
    // RUANG GERAK: jalur bebas di depan kepala (searah siklus) harus tetap sebagian besar ruang kosong.
    // Jika jalan pintas "melompati" terlalu banyak sel, kepala terkurung di kantong sempit (hanya bisa mengekor).
    const freeAfter=N-sim.ns.length;
    const arc=((idx[sim.ns[sim.ns.length-1]]-idx[sim.ns[0]]+N)%N||N)-1;
    const arcRatio=freeAfter>0?Math.min(1,arc/freeAfter):1;
    const arcNeed=AI_TUNE.arc0+AI_TUNE.arc1*fill+(phase.escape/100); // makin panjang, makin ketat menjaga ruang keluar
    const arcPen=(freeAfter>6&&arcRatio<arcNeed)?1000+(arcNeed-arcRatio)*1000:0;
    // kepala tidak boleh berada di ruang yang jauh lebih kecil daripada seluruh sel kosong
    const reachPen=Math.max(0,(freeAfter*(AI_TUNE.reach+phase.reach*.08)-fs.reach))*(1+fill*3+phase.reach);
    const minEscape=phase.escape;
    const escapePen=(freeAfter>minEscape&&fs.reach<minEscape)?(minEscape-fs.reach)*phase.reach*18:0;
    const risk=((sim.ns.length<N-3&&fs.reach<4)?60:0)+arcPen+reachPen+escapePen;
    let steps2=0;
    const eatenNow=new Set();for(const x of cd.cells)if(apples.has(x))eatenNow.add(x);
    const rest=new Set();for(const a of apples)if(!eatenNow.has(a))rest.add(a);
    if(rest.size>0&&sim.ns.length<N){
      const dEnd=dirIndex(m>1?cd.cells[m-2]:head,cd.cells[m-1]);
      dpPlan(sim.ns,rest,dEnd);
      let bc=INF,bs=0;
      for(const a of rest){const st=bestAt(a);if(st>=0&&_cost[st]<bc){bc=_cost[st];bs=_stp[st];}}
      steps2=bc<INF?bs:30;
    }
    let cnt=0;for(const x of cd.cells)if(apples.has(x))cnt++;
    const turns=countTurns(head,cd.cells,heading);
    // Penalti shortcut: jalur yang jauh menyimpang dari urutan siklus diberi biaya ekstra.
    // Ini menjaga ritme spiral yang terlihat pada video; penalti tidak boleh mengalahkan risiko tabrakan.
    const cycleOffset=(idx[cd.a]-hi+N)%N;
    const skipped=Math.max(0,cycleOffset-m);
    const spiralPenalty=cd.kind==='cyc'?0:Math.min(skipped, Math.max(0,freeAfter))*phase.shortcut;

    // Fase pendek lebih berani mengejar makanan; fase panjang makin mengutamakan ruang dan survival.
    const foodReward=cnt*phase.food*4;
    const switchingPenalty=(_commit>=0&&apples.has(_commit)&&cd.a!==_commit)?phase.commit*.65:0;
    const score=m+phase.lookahead*steps2+holePen+phase.turn*turns+spiralPenalty
               -AI_TUNE.enroute*(cnt-1)-foodReward+risk
               -(cd.a===_commit?phase.commit:0)+switchingPenalty;
    cd.score=score;
    if(score<bestScore){bestScore=score;best=cd;}
  }
  if(!best)return cycleStep();
  _commit=best.a;
  return best.cells[0];
}

function step(){
  const n=nextMove();
  if(n<0)return 2; // papan penuh / buntu -> ronde baru
  const t=snake[snake.length-1];
  prev=snake.slice();
  const grow=apples.has(n);
  snake.unshift(n);
  if(grow){apples.delete(n);eaten++;prev.push(t);}
  else{snake.pop();occ[t]=0;}
  occ[n]=1;
  return snake.length>=N?2:(grow?1:0);
}

function drawBoardTile(g, theme) {
  const w = 512, h = 512;
  g.fillStyle = theme.bg;
  g.fillRect(0, 0, w, h);
  
  for (let y = 0; y < 2; y++) {
    for (let x = 0; x < 2; x++) {
      const cx = x * 256, cy = y * 256;
      g.fillStyle = (x + y) % 2 ? theme.alt : theme.bg;
      g.fillRect(cx, cy, 256, 256);
      
      // Panel inner bevel highlight
      g.fillStyle = theme.bevel || 'rgba(255, 255, 255, 0.08)';
      g.fillRect(cx + 2, cy + 2, 252, 4);
      g.fillRect(cx + 2, cy + 2, 4, 252);
      
      // Precision grid lines (terlihat sangat tegas dan jelas di layar)
      g.strokeStyle = theme.line;
      g.lineWidth = 2.5;
      g.strokeRect(cx + 2, cy + 2, 252, 252);
      
      // Telemetry crosshairs (+)
      g.strokeStyle = theme.cross;
      g.lineWidth = 2.5;
      const ch = 14;
      g.beginPath();
      g.moveTo(cx, cy - ch); g.lineTo(cx, cy + ch);
      g.moveTo(cx - ch, cy); g.lineTo(cx + ch, cy);
      g.stroke();
      
      // Micro-dots
      g.fillStyle = theme.dot || theme.cross;
      g.beginPath();
      g.arc(cx + 128, cy + 128, 3.5, 0, Math.PI * 2);
      g.fill();
    }
  }
  // Border perimeter dek
  g.strokeStyle = theme.cross;
  g.lineWidth = 5;
  g.strokeRect(2, 2, w - 4, h - 4);
}

/* ===== Penggerak cadangan: rAF berhenti saat tab lain dibuka, worker + timer tetap mengetuk ===== */
const tick=()=>{const t=performance.now();if(t-lastRaf>350){cancelAnimationFrame(rafId);frame(t);}};

}catch(e){}
