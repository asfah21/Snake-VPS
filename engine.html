<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,body{margin:0;height:100%;height:100dvh;background:#02040a;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
/* ===== PANGGUNG RESPONSIF (lebar logika 1080, tinggi mengikuti viewport) ===== */
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:50% 50%;transform:translate(-50%,-50%);background:#02040a;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
.box{position:absolute;background:rgba(7,14,28,0.72);border:1px solid rgba(56,189,248,0.25);border-radius:24px;padding:14px 26px;font-weight:800;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 16px 48px rgba(0,0,0,0.75),inset 0 1px 0 rgba(255,255,255,0.15)}
/* HUD Telemetri ISS di tengah atas */
#hud{top:36px;left:50%;transform:translateX(-50%);display:flex;align-items:center;padding:12px 14px;border-radius:30px;white-space:nowrap;background:linear-gradient(180deg,rgba(11,23,45,0.85) 0%,rgba(6,12,24,0.7) 100%);border:1px solid rgba(56,189,248,0.35);box-shadow:0 16px 40px rgba(0,0,0,0.8),0 0 30px rgba(14,165,233,0.15),inset 0 1px 1px rgba(255,255,255,0.2)}
#hud .stat{display:flex;align-items:center;gap:14px;padding:2px 28px;position:relative}
#hud .stat+.stat{border-left:1px solid rgba(255,255,255,0.14)}
#hud .ic{font-size:38px;line-height:1;filter:drop-shadow(0 0 12px rgba(56,189,248,0.45))}
#hud .tx{display:flex;flex-direction:column;line-height:1.05}
#hud small{font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:rgba(186,230,253,0.75);font-weight:700}
#hud b{font-size:36px;font-weight:900;letter-spacing:-.02em;color:#ffe066;text-shadow:0 0 20px rgba(255,204,0,0.5)}
#hud em{font-style:normal;font-size:20px;opacity:.55;font-weight:600}
#hud .val{display:flex;align-items:baseline;gap:4px}
#hud .stat:first-child b{color:#38bdf8;text-shadow:0 0 20px rgba(56,189,248,0.65)}
#hud .stat:last-child b{color:#ff4365;text-shadow:0 0 20px rgba(255,67,101,0.65)}
/* Kartu daftar gift ISS Module: di bawah papan */
#tiers{left:50%;bottom:128px;transform:translateX(-50%);width:1010px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 14px;font-size:26px;max-height:420px;overflow:hidden;border-radius:24px;border:1px solid rgba(56,189,248,0.2);background:rgba(6,12,24,0.65)}
#tiers span{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:88px;background:rgba(15,28,52,0.65);border:1px solid rgba(56,189,248,0.28);border-radius:16px;padding:8px 18px;white-space:nowrap;line-height:1.4;box-shadow:inset 0 1px 0 rgba(255,255,255,0.1)}
#tiers span b{color:#38bdf8;text-shadow:0 0 12px rgba(56,189,248,0.5)}
#tiers i{font-style:normal;letter-spacing:.16em;color:rgba(186,230,253,0.85);font-size:.7em;text-transform:uppercase;font-weight:800;margin-right:4px}
#toast{left:50%;top:210px;transform:translate(-50%,-20px);opacity:0;transition:.35s;background:linear-gradient(90deg,rgba(14,165,233,0.9),rgba(236,72,153,0.9));text-align:center;font-size:32px;font-weight:800;border-radius:22px;max-width:940px;box-shadow:0 12px 35px rgba(0,0,0,0.8),0 0 30px rgba(56,189,248,0.35);border:1px solid rgba(255,255,255,0.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#over{inset:0;display:none;place-items:center;background:rgba(2,6,15,0.88);text-align:center;border-radius:0;border:0;font-size:92px;backdrop-filter:blur(20px)}
#over small{font-size:.36em;opacity:.8;color:#38bdf8}
#start{inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(6,15,35,0.7),rgba(2,4,10,0.96));cursor:default;border-radius:0;border:0;text-align:center;padding:0;transition:opacity .5s;opacity:1}
#start.off{opacity:0}
#cdwrap{position:relative;display:grid;place-items:center;width:520px;height:520px}
#cdring{position:absolute;inset:0;border-radius:50%;border:8px solid rgba(56,189,248,0.65);box-shadow:0 0 90px rgba(56,189,248,0.5),inset 0 0 90px rgba(236,72,153,0.4);animation:ringpop 1s ease-out both}
#cd{position:relative;font-size:280px;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 50px #38bdf8,0 0 120px #0284c7,0 8px 0 rgba(0,0,0,0.8);animation:cdpop 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes cdpop{0%{transform:scale(.5);opacity:0}22%{transform:scale(1.08);opacity:1}72%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes ringpop{0%{transform:scale(.72);opacity:0}25%{transform:scale(1);opacity:.95}100%{transform:scale(1.3);opacity:0}}
/* Layar HP: perbesar skor & daftar gift agar tetap terbaca setelah panggung diskalakan */
@media (max-width:600px){
  #hud{padding:16px;border-radius:34px}
  #hud .stat{gap:10px;padding:2px 18px}
  #hud .ic{font-size:46px}
  #hud small{font-size:24px;letter-spacing:.14em}
  #hud b{font-size:48px}
  #hud em{font-size:26px}
  #tiers{font-size:36px;gap:10px 12px}
  #tiers span{min-width:92px;padding:8px 14px}
  #toast{font-size:40px}
}

</head><body>
<div id="stage">
<div id="hud" class="box"><div class="stat" title="Ronde"><span class="ic">🏁</span><span class="tx"><small>Ronde</small><span class="val"><b id="r">1</b></span></span></div><div class="stat" title="Panjang ular"><span class="ic">📏</span><span class="tx"><small>Panjang</small><span class="val"><b id="l">3</b><em>/<span id="n"></span></em></span></span></div><div class="stat" title="Apel dimakan"><span class="ic">🍎</span><span class="tx"><small>Dimakan</small><span class="val"><b id="e">0</b></span></span></div></div>
<div id="tiers" class="box"></div>
<div id="toast" class="box"></div>
<div id="over" class="box"><div>🏆 PAPAN PENUH!<br><small>Ronde baru dimulai…</small></div></div>
<div id="start" class="box"><div id="cdwrap"><div id="cdring"></div><b id="cd">3</b></div></div>
</div>
<script type="module">
import * as THREE from 'three';
const QS=new URLSearchParams(location.search), $=id=>document.getElementById(id);

/* ================= LOGIKA GAME (AI ular: siklus Hamilton + jalan pintas aman) ================= */
//LOGIC_START
const PORT=QS.get('layout')?QS.get('layout')==='portrait':true,W=PORT?16:24,H=PORT?26:16,N=W*H, idx=new Int16Array(N), cyc=[];
document.body.classList.add(PORT?'p':'l');
for(let x=0;x<W;x++)cyc.push([x,0]);
for(let r=1;r<H;r++){if(r%2)for(let x=W-1;x>=1;x--)cyc.push([x,r]);else for(let x=1;x<W;x++)cyc.push([x,r]);}
for(let y=H-1;y>=1;y--)cyc.push([0,y]);
cyc.forEach((c,i)=>idx[c[1]*W+c[0]]=i);
const cell=i=>cyc[i][1]*W+cyc[i][0];
let snake,occ,apples,prev,eaten=0,round=1;
function reset(){occ=new Uint8Array(N);apples=new Set();snake=[cell(2),cell(1),cell(0)];snake.forEach(c=>occ[c]=1);prev=snake.slice();eaten=0;}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const _dist=new Int16Array(N),_first=new Int16Array(N),_q=new Int32Array(N);
const _parent=new Int32Array(N),_bodyIdx=new Int16Array(N),_vOcc=new Uint8Array(N),_visited=new Uint8Array(N);
const _tailDist=new Int16Array(N),_pathBuf=new Int32Array(N);

/* BFS standar (digunakan oleh freeCell untuk mencari sel bebas yang terjangkau) */
function bfs(start,allow){
  _dist.fill(-1);
  let head=0,tail=0;_q[tail++]=start;_dist[start]=0;
  while(head<tail){
    const c=_q[head++],cx=c%W,cy=(c/W)|0,d1=_dist[c]+1;
    for(let k=0;k<4;k++){
      const x=cx+DIRS[k][0],y=cy+DIRS[k][1];
      if(x<0||y<0||x>=W||y>=H)continue;
      const m=y*W+x;
      if(_dist[m]>=0)continue;
      if(occ[m]&&m!==allow)continue;
      _dist[m]=d1;
      _q[tail++]=m;
    }
  }
}

/* ===== STRATEGI: ular menyapu papan mengikuti siklus Hamilton (baris demi baris, rapat),
   dan hanya mengambil jalan pintas bila AMAN dan benar-benar menghemat langkah. =====
   Aturan emas: badan ular selalu tersusun menurut urutan siklus (ekor -> kepala).
   Jalan pintas hanya boleh MAJU di dalam sel kosong antara kepala dan ekor, tidak pernah
   mundur / memotong badan sendiri. Akibatnya: tidak ada ruang terisolasi, tidak ada
   gerakan berliku tanpa tujuan, dan ular tidak pernah terjebak. */
const _dpS=new Int32Array(N),_dpC=new Int32Array(N),_dpP=new Int32Array(N),_bodyOff=new Int32Array(N+1);
const INF=1e9;
function nextMove(){
  const L=snake.length,head=snake[0],tail=snake[L-1],hi=idx[head];
  const off=c=>(idx[c]-hi+N)%N;
  const atOff=o=>cell((hi+o)%N);
  // posisi ekor (dalam offset siklus) setelah t langkah tanpa makan. 0 dianggap N (melingkar penuh)
  for(let t=0;t<L;t++){const o=off(snake[L-1-t]);_bodyOff[t]=o===0?N:o;}
  const tailAt=t=>t>=L-1?N:_bodyOff[t];

  // langkah dasar: ikuti siklus (selalu aman)
  const nxt=cell((hi+1)%N);
  const cycleStep=()=>{
    if(!occ[nxt]||(nxt===tail&&!apples.has(nxt)))return nxt;
    return -1;
  };
  if(apples.size===0)return cycleStep();

  // DP jalur terpendek MONOTON (offset siklus selalu bertambah) = jalan pintas aman
  _dpS.fill(INF);_dpC.fill(0);_dpP.fill(-1);
  _dpS[head]=0;
  let reach=0;
  for(let o=0;o<N;o++){
    const c=atOff(o);
    const s=_dpS[c];
    if(s>=INF)continue;
    const cnt=_dpC[c],cx=c%W,cy=(c/W)|0;
    for(let k=0;k<4;k++){
      const nx=cx+DIRS[k][0],ny=cy+DIRS[k][1];
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const m=ny*W+nx,om=off(m);
      if(om<=o)continue;                        // hanya maju searah siklus
      const g=apples.has(m)?1:0;
      const T=tailAt(s-cnt);                    // posisi ekor saat langkah ini dijalankan
      if(!(om<T||(om===T&&!g)))continue;        // harus sel kosong (ekor boleh ditempati jika tidak tumbuh)
      const s2=s+1,c2=cnt+g;
      if(s2<_dpS[m]||(s2===_dpS[m]&&c2>_dpC[m])){_dpS[m]=s2;_dpC[m]=c2;_dpP[m]=c;}
    }
  }
  // pilih apel dengan langkah paling sedikit (seri: yang jalurnya melewati lebih banyak apel)
  let target=-1,bs=INF,bc=-1;
  for(const a of apples){
    const s=_dpS[a];
    if(s>=INF||s===0)continue;
    const c=_dpC[a];
    if(s<bs||(s===bs&&c>bc)){bs=s;bc=c;target=a;}
  }
  if(target<0)return cycleStep();
  let cur=target;
  while(_dpP[cur]!==head&&_dpP[cur]>=0)cur=_dpP[cur];
  return _dpP[cur]===head?cur:cycleStep();
}

function step(){
  const n=nextMove();
  if(n<0)return 2; // papan penuh / buntu -> ronde baru
  const t=snake[snake.length-1];
  prev=snake.slice();
  const grow=apples.has(n);
  snake.unshift(n);
  if(grow){apples.delete(n);eaten++;prev.push(t);}
  else{snake.pop();occ[t]=0;}
  occ[n]=1;
  return snake.length>=N?2:(grow?1:0);
}
//LOGIC_END

/* ================= SUARA (sintesis WebAudio + SFX arah + BGM browser) ================= */
const AC=new (window.AudioContext||window.webkitAudioContext)();
// "keep-alive" audio: osilator sunyi (gain ~0) supaya AudioContext tidak auto-suspend saat idle
try{const _k=AC.createOscillator(),_g=AC.createGain();_g.gain.value=.00001;_k.connect(_g).connect(AC.destination);_k.start();}catch(e){}
function tone(f,t0,d,type='sine',v=.2,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+d+.02);}
function crunch(t0,d=.08,f=1800,v=.5){const b=AC.createBuffer(1,Math.ceil(AC.sampleRate*d),AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2.2);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=.9;g.gain.value=v;s.connect(fl).connect(g).connect(AC.destination);s.start(t0);}
let lastEat=0;
const sfx={
  eat(){const n=performance.now(),quick=n-lastEat<160;if(n-lastEat<50)return;lastEat=n;const t=AC.currentTime;
    // gigitan apel: dua letupan renyah + hentakan rahang (volume dikecilkan)
    crunch(t,.05,3000,.26);crunch(t+.06,.08,1700,.2);tone(170,t,.09,'triangle',.12,80);
    // menelan: "glup" nada turun
    if(!quick){tone(430,t+.13,.17,'sine',.12,130);tone(215,t+.15,.12,'sine',.06,90);}},
  gift(n=1){const t=AC.currentTime;if(n>=50)[392,523,659].forEach((f,i)=>tone(f,t+i*.05,.9,'sawtooth',.06));[784,988,1175,1568,1976,2349,2637].slice(0,n>=50?7:5).forEach((f,i)=>{tone(f,t+i*.07,.35,'triangle',.22);tone(f*2,t+i*.07,.2,'sine',.08);});},
  over(){const t=AC.currentTime;[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,t+i*.14,.4,'square',.12));[523,659,784,1047].forEach(f=>tone(f,t+1.05,1.2,'triangle',.15));}
};

/* ===== Volume & URL audio (token overlay untuk OBS) ===== */
const VOL_BGM=.10;                       // backsound /mp3
const VOL_SFX=.25;                       // sound belok /sfx
const TOKEN=QS.get('token')||'';
const audioUrl=path=>TOKEN?`${path}${path.includes('?')?'&':'?'}token=${encodeURIComponent(TOKEN)}`:path;

/* ===== SFX arah: hanya saat arah ular berubah ===== */
const turnBuf={},turnGain=AC.createGain();
turnGain.gain.value=VOL_SFX;
turnGain.connect(AC.destination);
let lastDirKey='right';
for(const d of ['right','left','up','down']){
  fetch(audioUrl(`/sfx/${d}.mp3`),{credentials:'same-origin'})
    .then(r=>r.ok?r.arrayBuffer():Promise.reject())
    .then(b=>AC.decodeAudioData(b))
    .then(buf=>{turnBuf[d]=buf;})
    .catch(()=>{});
}
function dirFromStep(from,to){
  const dx=(to%W)-(from%W),dy=((to/W)|0)-((from/W)|0);
  return dx>0?'right':dx<0?'left':dy<0?'up':dy>0?'down':'';
}
function turnSound(from,to){
  const d=dirFromStep(from,to);
  if(!d)return;
  if(d!==lastDirKey&&turnBuf[d]){
    const s=AC.createBufferSource();s.buffer=turnBuf[d];s.connect(turnGain);s.start();
  }
  lastDirKey=d;
}

/* ===== BGM dari /mp3: folder kosong = tidak ada backsound ===== */
let bgm=null,bgmList=[],bgmIdx=0,bgmWanted=false,bgmStarted=false,bgmErrors=0,bgmStopped=false;
function playBgmTrack(){
  if(!bgm||!bgmList.length||bgmStopped)return;
  if(bgmErrors>=bgmList.length){bgmStopped=true;return;}
  const name=bgmList[bgmIdx%bgmList.length];
  bgmIdx=(bgmIdx+1)%bgmList.length;
  bgm.src=audioUrl('/mp3/'+encodeURIComponent(name));
  bgm.play().catch(()=>{});
}
function startBgm(){
  bgmWanted=true;
  if(!bgm||bgmStarted)return;
  bgmStarted=true;
  playBgmTrack();
}
fetch(audioUrl('/api/songs'),{credentials:'same-origin'})
  .then(r=>r.ok?r.json():null)
  .then(data=>{
    bgmList=Array.isArray(data&&data.songs)?data.songs:[];
    if(!bgmList.length)return;                       // kosong: jangan buat pemutar sama sekali
    bgm=new Audio();
    bgm.volume=VOL_BGM;
    bgm.preload='auto';
    bgm.addEventListener('playing',()=>{bgmErrors=0;});
    bgm.addEventListener('ended',playBgmTrack);
    bgm.addEventListener('error',()=>{bgmErrors++;setTimeout(playBgmTrack,800);});
    if(bgmWanted)startBgm();
  })
  .catch(()=>{});

// suara default ON: coba nyalakan audio sejak awal, lalu kejar terus sampai berhasil
const unlock=()=>{
  if(AC.state!=='running')AC.resume();
  if(bgmWanted&&bgm&&!bgmStopped&&bgm.paused)bgm.play().catch(()=>{});
};
['pointerdown','pointerup','click','keydown','keyup','touchstart','wheel'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
addEventListener('visibilitychange',unlock);
addEventListener('focus',unlock);
AC.onstatechange=unlock;                 // kalau browser men-suspend, langsung dinyalakan lagi
unlock();
setInterval(unlock,800);

/* ================= COUNTDOWN 3-2-1 → GAME LANGSUNG JALAN ================= */
let started=false;
const cdBox=$('start'),cdEl=$('cd'),cdRing=$('cdring');
function pop(txt){
  cdEl.textContent=txt;
  for(const el of [cdEl,cdRing]){el.style.animation='none';void el.offsetWidth;el.style.animation='';}
}
function countdown(){
  const seq=['3','2','1','GO!'],dur=1000;
  seq.forEach((s,i)=>setTimeout(()=>{
    pop(s);unlock();
    const t=AC.currentTime;
    if(s==='GO!')[523,659,784,1047].forEach((f,k)=>tone(f,t+k*.06,.4,'triangle',.22));
    else tone(720,t,.12,'triangle',.2);
    if(i===seq.length-1){                      // GO! → game langsung jalan, overlay memudar
      started=true;
      startBgm();
      setTimeout(()=>{cdBox.classList.add('off');setTimeout(()=>{cdBox.style.display='none';},500);},480);
    }
  },i*dur));
}
countdown();

/* ================= SCENE 3D ================= */
///// KANVAS LOGIKA 1080 x tinggi dinamis //////
const CW=1080;let CH=1920;const stage=$('stage');
const rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(1);rd.setSize(CW,CH,false);stage.append(rd.domElement);rd.shadowMap.enabled=true;rd.toneMapping=THREE.ACESFilmicToneMapping;rd.toneMappingExposure=1.15;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(48,CW/CH,.1,700);sc.fog=new THREE.Fog(0x070a18,90,330);
// Area aman kanvas: HUD di atas, kartu gift di bawah → papan dipaskan ke ruang di antaranya
const UI={top:.06,bottom:.175,side:.022},FILL=.96;   // FILL<1 = papan di-zoom sedikit lebih besar
const FIT=[];for(const x of[-W/2-.55,W/2+.55])for(const z of[-H/2-.55,H/2+.55])for(const y of[-.5,2.2])FIT.push(new THREE.Vector3(x,y,z));
const _v=new THREE.Vector3();
function bounds(){let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;for(const p of FIT){_v.copy(p).project(cam);if(_v.x<minX)minX=_v.x;if(_v.x>maxX)maxX=_v.x;if(_v.y<minY)minY=_v.y;if(_v.y>maxY)maxY=_v.y;}return{minX,maxX,minY,maxY};}
function placeCam(d){cam.position.set(0,d*.82,d*.57+1);cam.lookAt(0,0,-H*.04);cam.updateMatrixWorld();}
// Panggung mengikuti viewport: lebar tetap 1080 unit, tinggi menyesuaikan rasio layar.
// Board tetap proporsional karena kamera memakai aspek viewport, bukan ditarik/stretch.
function fitStage(){
  const vw=Math.max(1,window.innerWidth||1),vh=Math.max(1,window.innerHeight||1);
  const s=vw/CW;
  CH=vh/s;
  stage.style.width=CW+'px';
  stage.style.height=CH+'px';
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
  // Resolusi buffer mengikuti devicePixelRatio setelah skala panggung,
  // sehingga 1080 unit logika tidak berubah tetapi hasil render tetap tajam.
  const renderScale=Math.min(2,(window.devicePixelRatio||1)*s);
  rd.setPixelRatio(renderScale);
  rd.setSize(CW,CH,false);
}
function fitCamera(){
  cam.aspect=CW/CH;cam.clearViewOffset();cam.updateProjectionMatrix();
  const rw=2*(1-UI.side*2),rh=2*(1-UI.top-UI.bottom);let lo=8,hi=560;
  for(let i=0;i<26;i++){const m=(lo+hi)/2;placeCam(m);const b=bounds();(b.maxY-b.minY<=rh&&b.maxX-b.minX<=rw)?hi=m:lo=m;}
  placeCam(hi*FILL);const b=bounds(),cx=(b.minX+b.maxX)/2,cy=(b.minY+b.maxY)/2,tY=1-2*(UI.top+(1-UI.top-UI.bottom)/2);
  cam.setViewOffset(CW,CH,-cx*CW/2,(tY-cy)*CH/2,CW,CH);   // geser papan tepat ke tengah area aman
}
function layout(){fitStage();fitCamera();}
layout();

const cv = (w, h, f) => {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  f(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
};

function drawBoardTile(g, theme) {
  const w = 512, h = 512;
  g.fillStyle = theme.bg;
  g.fillRect(0, 0, w, h);
  
  for (let y = 0; y < 2; y++) {
    for (let x = 0; x < 2; x++) {
      const cx = x * 256, cy = y * 256;
      g.fillStyle = (x + y) % 2 ? theme.alt : theme.bg;
      g.fillRect(cx, cy, 256, 256);
      
      // Panel inner bevel highlight
      g.fillStyle = theme.bevel || 'rgba(255, 255, 255, 0.08)';
      g.fillRect(cx + 2, cy + 2, 252, 4);
      g.fillRect(cx + 2, cy + 2, 4, 252);
      
      // Precision grid lines (terlihat sangat tegas dan jelas di layar)
      g.strokeStyle = theme.line;
      g.lineWidth = 2.5;
      g.strokeRect(cx + 2, cy + 2, 252, 252);
      
      // Telemetry crosshairs (+)
      g.strokeStyle = theme.cross;
      g.lineWidth = 2.5;
      const ch = 14;
      g.beginPath();
      g.moveTo(cx, cy - ch); g.lineTo(cx, cy + ch);
      g.moveTo(cx - ch, cy); g.lineTo(cx + ch, cy);
      g.stroke();
      
      // Micro-dots
      g.fillStyle = theme.dot || theme.cross;
      g.beginPath();
      g.arc(cx + 128, cy + 128, 3.5, 0, Math.PI * 2);
      g.fill();
    }
  }
  // Border perimeter dek
  g.strokeStyle = theme.cross;
  g.lineWidth = 5;
  g.strokeRect(2, 2, w - 4, h - 4);
}

function applyTheme(r) {
  const theme = THEMES[(r - 1) % THEMES.length];
  if (tileCtx) {
    drawBoardTile(tileCtx, theme);
    tile.needsUpdate = true;

  trim.color.setHex(theme.trim);
  beamM.color.setHex(theme.trim);
  slab.material.color.setHex(theme.slab);
  hull.material.color.setHex(theme.hull);
}

// Apel kristal merah ruby cerah
const appleMat = new THREE.MeshStandardMaterial({

// Efek glow ringan melingkar lembut di lantai persis di bawah apel
const glowTexture = cv(128, 128, (g, w, h) => {

const stemI = mk(new THREE.CylinderGeometry(0.03, 0.03, 0.22, 5), new THREE.MeshStandardMaterial({color: 0x10b981, emissive: 0x065f46, roughness: 0.3}), N);

// Partikel percikan saat apel dimakan
const PN = 200, part = mk(new THREE.SphereGeometry(0.09, 6, 6), new THREE.MeshBasicMaterial({color: 0x38bdf8}), PN), pd = [];
for (let i = 0; i < PN; i++) pd.push({l: 0, p: new THREE.Vector3(), v: new THREE.Vector3()});
const wp = c => new THREE.Vector3((c % W) - W / 2 + 0.5, R, ((c / W) | 0) - H / 2 + 0.5);
function burst(p, n = 10) {
  for (const q of pd) {
    if (n <= 0) break;
    if (q.l <= 0) {

// Palet warna ular terhubung dengan sistem tema dinamis (kontras tinggi)
const PATS = THEMES.map(t => t.pat);
const HEADC = THEMES.map(t => t.head);

/* ================= ALUR PERMAINAN ================= */
let queue=0,flying=[],fly=new Set(),acc=0,over=0,spawnT=0,flash=0,jaw=0,bulges=[],bulgeMid=18;const BASE=2;
let GIFTS=[["🌹","Rose",5],["🫰","Finger Heart",5],["🍦","Ice Cream Cone",8],["🍩","Doughnut",30],["🤲","Hand Hearts",20],["🦢","Swan",40],["🐶","Corgi",50],["🌌","Galaxy",150],["🦁","Lion",300]];
function tiers(){$('tiers').innerHTML=`<i>Gift → 🍎</i>`+GIFTS.map(g=>`<span>${g[0]} <b>${g[2]}</b></span>`).join('');}tiers();
$('n').textContent=N;reset();applyTheme(round);
/* Hanya pilih sel kosong yang masih bisa DICAPAI kepala (supaya apel tidak muncul
   di kantong tertutup badan sendiri lalu membuat game macet). */
function freeCell(){
  const f=[];bfs(snake[0],snake[snake.length-1]);
  for(let c=0;c<N;c++)if(!occ[c]&&!apples.has(c)&&!fly.has(c)&&_dist[c]>=0)f.push(c);
  return f.length?f[(Math.random()*f.length)|0]:-1;
}
function launch(){const c=freeCell();if(c<0){queue=0;return;}flying.push({c,t:0});fly.add(c);}
function gift(user,name,n,icon='🎁'){queue+=n;flash=1;sfx.gift(n);const t=$('toast');t.textContent=`${icon} ${user||'Seseorang'} kirim ${name||'gift'} → +${n} apel!`;t.style.background=n>=100?'linear-gradient(90deg,#ff9f1c,#ff2d95)':n>=30?'#a23bffcc':'#ff2d55cc';t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3200);}
function newRound(){over=0;$('over').style.display='none';round++;reset();applyTheme(round);queue=0;flying=[];fly.clear();bulges=[];acc=0;spawnT=0;lastEatAt=performance.now();lastDirKey='right';}
function ui(){$('r').textContent=round;$('l').textContent=snake.length;$('e').textContent=eaten;}
(function ws(){
  const qsPort=QS.get('ws');
  const directPort=qsPort||((location.protocol==='http:'&&location.port==='8001')?'8766':'');
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const base=directPort?`${proto}//${location.hostname}:${directPort}`:`${proto}//${location.host}/ws`;
  const token=QS.get('token')||'';
  const url=token?`${base}?token=${encodeURIComponent(token)}`:base;
  try{
    const s=new WebSocket(url);
    s.onmessage=e=>{const p=JSON.parse(e.data);if(p.type==='gift')gift(p.user,p.gift,p.apples,p.icon);if(p.type==='config'){GIFTS=p.gifts;tiers();}};
    s.onclose=e=>{if(e&&e.code===1008)return;setTimeout(ws,2500);};
    s.onerror=()=>s.close();
  }catch(e){setTimeout(ws,3000);}
})();
/* ===== SHORTCUT SIMULASI GIFT (tanpa TikTok) =====
   Ctrl+1 … Ctrl+9 = gift ke-1..9, Ctrl+0 = gift ke-10, Ctrl+N = RONDE BARU.
   Angka 1-4 tanpa Ctrl juga masih berfungsi (tes cepat ala lama).            */
function giftKe(i){
  const g=GIFTS[i];
  if(!g)return;
  gift('Tes',g[1],g[2],g[0]);          // user, nama gift, jumlah apel, ikon
}
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey){
    const m=/^Digit([0-9])$/.exec(e.code)||/^([0-9])$/.exec(e.key);
    if(m){
      e.preventDefault();
      const d=+m[1];
      giftKe(d===0?9:d-1);              // Ctrl+0 → gift ke-10
      return;
    }
    if(e.key==='n'||e.key==='N'||e.key==='r'||e.key==='R'){e.preventDefault();newRound();return;}
    if(e.key==='+'||e.key==='='){e.preventDefault();for(const g of GIFTS)gift('Tes',g[1],g[2],g[0]);return;}
  }
  const k={1:['Rose',5,'🌹'],2:['Doughnut',30,'🍩'],3:['Corgi',50,'🐶'],4:['Galaxy',150,'🌌']}[e.key];
  if(k)gift('Tes',k[0],k[1],k[2]);
  if(e.key==='r'||e.key==='R')newRound();
});

/* Kecepatan ular TETAP: banyak apel/gift tidak lagi membuat ular makin cepat. */
const STEP_MS=170;
const stepOf=()=>STEP_MS;
let last=performance.now(),tc=0,rafId=0,lastRaf=performance.now(),lastEatAt=performance.now();const col=new THREE.Color();
/* Tutup ronde: tampilkan papan + mulai ronde baru otomatis. */
function akhirRonde(judul){
  $('over').innerHTML=`<div>${judul}<br><small>Ronde baru dimulai…</small></div>`;
  $('over').style.display='grid';
  sfx.over();
}
function frame(now){
  const dt=Math.min((now-last)/1000,document.hidden?1:.1);last=now;const T=now/1000;
  // gembulan menelan hanya berjalan sampai PERUT TENGAH (setengah panjang badan)
  bulgeMid=Math.max(4,snake.length*.5)*6;
  if(started&&!over){
    const sm=stepOf();acc+=dt*1000;
    while(acc>=sm&&!over){acc-=sm;const oldHead=snake[0],r=step();
      if(snake[0]!==oldHead)turnSound(oldHead,snake[0]);
      if(r===1){sfx.eat();burst(wp(snake[0]),8);jaw=1;bulges.push(0);lastEatAt=now;}
      if(r===2){over=now;akhirRonde('🏆 PAPAN PENUH!');}}
    // papan buntu (badan mengunci, tidak ada apel terjangkau) → tutup ronde juga
    if(!over&&snake.length>N*0.45&&now-lastEatAt>12000){over=now;akhirRonde('⏳ PAPAN BUNTU!');}
    spawnT-=dt;
    // sisa sel yang masih bisa diisi apel (papan penuh → berhenti spawn & buang antrean)
    const ruang=N-snake.length-apples.size-flying.length;
    if(!over&&ruang>0){
      if(queue>0){if(spawnT<=0){queue--;launch();spawnT=Math.max(.012,.07-queue*.0008);}}
      else{let g=0;while(apples.size+flying.length<BASE&&g++<BASE){const c=freeCell();if(c<0)break;apples.add(c);}}
    }else if(ruang<=0)queue=0;                 // papan penuh: antrean gift dihentikan
    const sp=6*1000/sm;for(let i=bulges.length-1;i>=0;i--){bulges[i]+=dt*sp;if(bulges[i]>=bulgeMid)bulges.splice(i,1);}
  }else if(now-over>4500)newRound();
  const k=over?1:Math.min(1,acc/stepOf());
  const P=snake.map((c,i)=>wp(c).lerp(wp(prev[Math.min(i,prev.length-1)]),1-k));
  const tot=(P.length-1)*6;let bn=0;
  for(let i=0;i<P.length-1;i++){const p0=P[Math.max(i-1,0)],p1=P[i],p2=P[i+1],p3=P[Math.min(i+2,P.length-1)];
    const dx=p2.x-p1.x,dz=p2.z-p1.z,l=Math.hypot(dx,dz)||1;
    for(let s=0;s<6;s++){const t=s/6,t2=t*t,t3=t2*t,j=i*6+s;
      const f=q=>.5*(2*p1[q]+(-p0[q]+p2[q])*t+(2*p0[q]-5*p1[q]+4*p2[q]-p3[q])*t2+(-p0[q]+3*p1[q]-3*p2[q]+p3[q])*t3);
      const wig=Math.sin(j*.27-T*5)*.05*Math.min(1,j/15)*Math.min(1,(tot-j)/30);
      let r=R*Math.min(1,.3+(tot-j)/22)*(j<9?.86+j*.015:1);
      let bl=0;for(const b of bulges){const pg=b/bulgeMid;if(pg<1)bl+=Math.exp(-(((j-b)/10)**2))*(1-pg);} // gembulan memudar sebelum perut tengah
      r*=1+.55*Math.min(bl,1);
      D.position.set(f('x')-dz/l*wig,.1+r*.92,f('z')+dx/l*wig);D.quaternion.identity();D.scale.set(r,r*.9,r);D.updateMatrix();body.setMatrixAt(bn,D.matrix);
      const u=j/6,pc=PATS[(round-1)%PATS.length](u,j);col.setHSL(pc[0],pc[1],Math.min(.95,pc[2]+(bl>.3?.1:0)));body.setColorAt(bn,col);bn++;}}
  body.count=bn;body.instanceMatrix.needsUpdate=true;body.instanceColor.needsUpdate=true;
  {const hc=HEADC[(round-1)%HEADC.length];headMat.color.setHSL(hc[0],hc[1],hc[2]);}head.position.set(P[0].x,.1+R*.95,P[0].z);
  if(P.length>1){const d=P[0].clone().sub(P[1]);if(d.lengthSq()>1e-4)head.rotation.y=Math.atan2(d.x,d.z);}
  jaw=Math.max(0,jaw-dt*2.5);jawG.rotation.x=jaw*.55;hb.scale.setScalar(1.15*(1+jaw*.1));tg.scale.z=Math.sin(T*7)>.55&&jaw<.1?1:.05;
  let an=0;
  const put=(p,s)=>{D.quaternion.identity();D.position.copy(p);D.position.y+=Math.sin(T*3+p.x)*.04;D.scale.setScalar(s);D.updateMatrix();appleG.setMatrixAt(an,D.matrix);
    D.position.y+=s+.08;D.scale.set(1,1,1);D.updateMatrix();stemI.setMatrixAt(an,D.matrix);
    D.position.set(p.x,.02,p.z);D.scale.setScalar(1.3+Math.sin(T*4+p.z)*.15);D.updateMatrix();glowI.setMatrixAt(an,D.matrix);an++;};
  for(const a of apples){const p=wp(a);p.y=.3;put(p,.3);}
  for(let i=flying.length-1;i>=0;i--){const f=flying[i];f.t+=dt/.9;if(f.t>=1){fly.delete(f.c);if(!occ[f.c]){apples.add(f.c);burst(wp(f.c),5);}else queue++;flying.splice(i,1);continue;}
    const to=wp(f.c),p=P0.clone().lerp(to,f.t);p.y=P0.y+(.3-P0.y)*f.t+Math.sin(f.t*Math.PI)*4;put(p,.3*(.5+.5*f.t));}
  appleG.count=glowI.count=stemI.count=an;[appleG,glowI,stemI].forEach(m=>m.instanceMatrix.needsUpdate=true);
  let pn=0;for(const q of pd){if(q.l>0){q.l-=dt;q.v.y-=9*dt;q.p.addScaledVector(q.v,dt);D.position.copy(q.p);D.scale.setScalar(Math.max(q.l,0)*1.6);}else D.scale.setScalar(0);D.quaternion.identity();D.updateMatrix();part.setMatrixAt(pn++,D.matrix);}part.instanceMatrix.needsUpdate=true;
  flash=Math.max(flash-dt*1.2,queue>0?1:0);
  disc.material.opacity=.35+Math.sin(T*3)*.08+flash*.5;disc.material.color.setHex(flash>.2?0xffe066:0x5ab4ff);pl.intensity=10+flash*160;ring.rotation.z+=dt*(.4+flash*4);
  earth.rotation.y += dt * 0.006;
  atm.rotation.y += dt * 0.007;
  dust.rotation.y += dt * 0.015;
  dish.rotation.z += dt * 0.02;
  for (const w of solarWings) w.rotation.x = Math.sin(T * 0.1) * 0.12;
  lastRaf=now;ui();
  if(!document.hidden)rd.render(sc,cam);          // tab tidak aktif: cukup logika, hemat GPU
  rafId=requestAnimationFrame(frame);
}
rafId=requestAnimationFrame(frame);

/* ===== Penggerak cadangan: rAF berhenti saat tab lain dibuka, worker + timer tetap mengetuk ===== */
const tick=()=>{const t=performance.now();if(t-lastRaf>350){cancelAnimationFrame(rafId);frame(t);}};
try{
  const src='setInterval(()=>postMessage(1),250)';   // timer di dalam worker tidak kena throttle tab
  const wk=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  wk.onmessage=tick;
}catch(e){}
setInterval(tick,400);                               // jaring pengaman kedua (main thread)
addEventListener('visibilitychange',()=>{last=performance.now();lastRaf=performance.now();});
addEventListener('pageshow',()=>{last=performance.now();lastRaf=performance.now();});
